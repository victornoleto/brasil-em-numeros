server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    charset_types text/css application/javascript application/json text/csv;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; base-uri 'self'; frame-ancestors 'self'" always;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json text/csv image/svg+xml;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    # HTML sempre revalidado, para atualizações aparecerem na hora.
    location = /index.html { add_header Cache-Control "no-cache" always; include /etc/nginx/conf.d/headers.inc; }

    # Dados: revalidar sempre (você pode editar os CSVs sem rebuild de cache).
    location /data/ {
        types { text/csv csv; application/json json; }
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/conf.d/headers.inc;
    }

    # CSS/JS: cache de 7 dias.
    location /assets/ {
        add_header Cache-Control "public, max-age=604800" always;
        include /etc/nginx/conf.d/headers.inc;
    }

    location / { try_files $uri $uri/ /index.html; }
}
