# brasil-em-numeros.local — o painel servido direto de public/ pelo nginx do host, sem container.
# Instalação (uma vez; copia, e não symlinka, para o site não mudar enquanto o arquivo é editado):
#   sudo cp /var/www/victor/brasil-em-numeros/nginx.local.conf /etc/nginx/sites-available/brasil-em-numeros.local
#   sudo ln -sf /etc/nginx/sites-available/brasil-em-numeros.local /etc/nginx/sites-enabled/brasil-em-numeros.local
#   grep -q brasil-em-numeros.local /etc/hosts || echo '127.0.0.1 brasil-em-numeros.local' | sudo tee -a /etc/hosts
#   sudo nginx -t && sudo systemctl reload nginx
#
# Mesmos cabeçalhos de segurança do nginx.conf (o do Docker), mas sem cache: uma edição em
# public/ aparece no próximo F5.

server {
    listen 80;
    listen [::]:80;
    server_name brasil-em-numeros.local;

    access_log /var/log/nginx/brasil-em-numeros.access.log;
    error_log  /var/log/nginx/brasil-em-numeros.error.log;

    root /var/www/victor/brasil-em-numeros/public;
    index index.html;
    charset utf-8;
    charset_types text/css application/javascript application/json text/csv;

    # add_header não é herdado por location que tem o seu, então cada uma inclui os cabeçalhos.
    location /data/ {
        types { text/csv csv; application/json json; }
        add_header Cache-Control "no-cache" always;
        include /var/www/victor/brasil-em-numeros/headers.inc;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        include /var/www/victor/brasil-em-numeros/headers.inc;
        try_files $uri $uri/ =404;
    }
}
